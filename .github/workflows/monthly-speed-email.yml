# A speed test and email on request (Actions > Run workflow), saving the results in docs/speed-tests.
# The monthly email on the 1st now comes from the website's own Cloudflare timer
# (functions-lib/speed.js, results kept in the studio database); GitHub's schedules ran late or not at all.
# Needs the PAGESPEED_API_KEY and RESEND_API_KEY secrets
# (GitHub > the repository > Settings > Secrets and variables > Actions).
# "Run workflow" on the Actions tab tests and sends one straight away.
name: Monthly speed email

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and send the email
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/monthly-speed-email.mjs
      - name: Save the results
        run: |
          git add docs/speed-tests
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "Monthly speed test"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Monthly speed test results [skip ci]"
          git pull --rebase && git push
