# Rebuild the site on request (Actions > Run workflow). The morning check for posts scheduled in
# Moments Studio now runs on the website's own Cloudflare timer (functions-lib/schedules.js), which
# rebuilds only when a post is due; GitHub's schedules ran late or not at all. It asks Cloudflare Pages to rebuild through a deploy hook; the hook's
# address is kept in this repository's secrets as CF_DEPLOY_HOOK
# (GitHub > the repository > Settings > Secrets and variables > Actions).
name: Daily rebuild for scheduled posts

on:
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudflare Pages to rebuild
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK isn't set yet"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Rebuild requested"
