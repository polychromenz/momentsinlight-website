# Cloudflare Pages settings, used by `wrangler pages dev` locally and when deploying.
name = "momentsinlight-website"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Database for the wedding photo guide signups (see docs/forms-setup.md).
# The table is created by migrations/0001_guide_signups.sql.
[[d1_databases]]
binding = "DB"
database_name = "momentsinlight-signups"
database_id = "59f39416-41d5-4ae3-aed9-70a36b2b812c"
migrations_dir = "migrations"
